AWSTemplateFormatVersion: "2010-09-09"
Description: "T5 - Multi-resource template with multiple vulnerabilities"
Resources:
  BadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: bad-bucket
  WildcardRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "sts:AssumeRole"
  OpenSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Open
      SecurityGroupIngress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
  UnencryptedDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.t3.micro
      Engine: mysql
      StorageEncrypted: false
