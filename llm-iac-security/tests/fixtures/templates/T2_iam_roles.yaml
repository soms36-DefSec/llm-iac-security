AWSTemplateFormatVersion: "2010-09-09"
Description: "T2 - Overly permissive IAM roles"
Resources:
  AdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: AdminPolicy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"
