stages:
  - test
  - security

# -------------------------------------------------------
# Stage 1: Lint and unit tests (no cloud needed)
# -------------------------------------------------------
unit-tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt
  script:
    - flake8 . --max-line-length=120 --exclude=venv,env,.venv
    - pytest tests/unit/ -v --cov=. --cov-report=term-missing
  only:
    - merge_requests
    - main

# -------------------------------------------------------
# Stage 2: Security scan (requires AWS/Pinecone secrets)
# -------------------------------------------------------
iac-security-scan:
  stage: security
  image: python:3.11-slim
  needs: [unit-tests]
  before_script:
    - pip install -r requirements.txt
  script:
    - |
      for t in tests/fixtures/templates/T*.yaml; do
        echo "Scanning: $t"
        python scripts/run_scan.py "$t" --mode aws || true
      done
  artifacts:
    paths:
      - data/reports/generated/
    expire_in: 30 days
  only:
    - main
  variables:
    MODE: aws
